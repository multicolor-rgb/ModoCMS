# Release notes for Modo CMS 3.0.2.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.2
            - **Optional theme editor styles:** a theme can ship `themes/<theme>/assets/css/editor.css` to style the TinyMCE and Editor.js canvas only.
            - **Automatic opt-in:** the file is detected by its existence — no new setting, no fallback to `style.css`, and no frontend changes.
            - **Theme metadata:** optional `editor.body_class` and `editor.content_style` keys in `theme.json`.
            - **Editor.js scoping:** relative URLs and `@import` are rewritten to theme URLs, while Customizer variables override defaults from `editor.css`.
            - **Bundled examples:** `editor.css` files for the `default`, `default2` and `editorial` themes.
            - **No database changes:** updating from 3.0.1 requires no migration — replacing the files is enough.

            ### Najważniejsze zmiany w 3.0.2
            - **Opcjonalne style motywu w edytorze:** motyw może dostarczyć `themes/<motyw>/assets/css/editor.css`, który stylizuje wyłącznie kanwę TinyMCE i Editor.js.
            - **Automatyczne włączanie:** plik jest wykrywany po istnieniu — bez nowego ustawienia, bez fallbacku na `style.css` i bez zmian na frontendzie.
            - **Metadane motywu:** opcjonalne klucze `editor.body_class` i `editor.content_style` w `theme.json`.
            - **Scopowanie Editor.js:** względne URL-e i `@import` są zamieniane na URL-e motywu, a zmienne Customizera nadpisują wartości domyślne z `editor.css`.
            - **Przykłady w motywach:** pliki `editor.css` dla motywów `default`, `default2` i `editorial`.
            - **Bez zmian w bazie:** aktualizacja z 3.0.1 nie wymaga migracji — wystarczy podmienić pliki.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
