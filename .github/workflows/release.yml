# Release notes for Modo CMS 3.0.4.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.4
            - **TinyMCE only:** the Editor.js block editor and its settings/assets were removed; legacy JSON content is converted to HTML automatically on the first admin request (CLI: `tools/migrate-editorjs.php`).
            - **Better grid editing:** dashed row/column guides, 10 px canvas padding, automatic `<p>` wrappers and normalisation so changing a block format no longer destroys the grid.
            - **No horizontal scrollbar:** `box-sizing: border-box` for grid containers/columns and `overflow-x: hidden` in the editor canvas.
            - **Dark mode:** the TinyMCE content canvas always stays white; only the toolbar and dialogs follow the dark theme.
            - **No schema changes:** the updater only converts legacy content when such documents exist.

            ### Najważniejsze zmiany w 3.0.4
            - **Tylko TinyMCE:** edytor blokowy Editor.js oraz jego ustawienia i zasoby zostały usunięte; stara treść JSON jest automatycznie konwertowana do HTML przy pierwszym wejściu do panelu (CLI: `tools/migrate-editorjs.php`).
            - **Lepsze edytowanie siatek:** przerywane prowadnice wierszy i kolumn, padding kanwy 10 px, automatyczne owijanie w `<p>` i normalizacja — zmiana formatu bloku nie niszczy już siatki.
            - **Brak poziomego paska przewijania:** `box-sizing: border-box` dla kontenerów i kolumn siatek oraz `overflow-x: hidden` na kanwie edytora.
            - **Tryb ciemny:** kanwa TinyMCE zawsze pozostaje biała; ciemny motyw obejmuje tylko pasek narzędzi i dialogi.
            - **Bez zmian w schemacie bazy:** aktualizator konwertuje wyłącznie stare dokumenty, jeśli takie istnieją.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
