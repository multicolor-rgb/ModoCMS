# Release notes for Modo CMS 3.0.6.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.6
            - **Select all in the media picker:** multi-select mode now has a "Select all" checkbox that respects the current folder filter.
            - **Bulk media editing:** update ALT text and captions, transform selected images (rotate, flip, resize, quality) and regenerate their thumbnails.
            - **Force-regenerate all thumbnails:** Settings → Performance rebuilds every preview and gallery thumbnail for the whole library.
            - **Instant thumbnail rebuild:** editing an image regenerates every configured size, including gallery widths.
            - **Automatic schema migration:** new `alt_text` and `caption` columns are added automatically.

            ### Najważniejsze zmiany w 3.0.6
            - **Zaznacz wszystko w oknie mediów:** tryb wielokrotnego wyboru ma checkbox respektujący filtr folderu.
            - **Masowa edycja mediów:** ALT/podpisy, obrót/odbicie/resize/jakość dla zaznaczonych zdjęć oraz regeneracja ich miniatur.
            - **Wymuszone generowanie wszystkich miniatur:** Ustawienia → Wydajność odtwarza wszystkie podglądy i miniatury galerii.
            - **Natychmiastowe odtwarzanie miniatur:** edycja zdjęcia generuje ponownie wszystkie rozmiary, w tym galeryjne.
            - **Automatyczna migracja schematu:** nowe kolumny `alt_text` i `caption` są dodawane automatycznie.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
