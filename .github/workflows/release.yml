# Release notes for Modo CMS 3.0.3.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.3
            - **Gallery thumbnails:** galleries load 480/960 px thumbnails through `srcset`/`sizes`, reuse existing 240/320 px previews and keep the lightbox on the original image.
            - **Gallery backfill:** *Settings → Performance* shows missing thumbnail counts and a button that processes only images used by galleries; large photos fall back to the ImageMagick CLI.
            - **One-click updater:** *Settings → System* checks GitHub, downloads over HTTPS, verifies SHA-256 when available, creates database and file backups, and rolls back on failure.
            - **Update diagnostics:** GitHub API rate limits fall back to the public `releases.atom` feed; an optional `update_github_token` raises the limit and the check cache lasts 12 hours.
            - **Cookie Consent 1.0.1:** only the full-screen modal locks page scrolling; bars and cards no longer block the page.
            - **No database changes:** updating from 3.0.2 requires no migration — replacing the files is enough.

            ### Najważniejsze zmiany w 3.0.3
            - **Miniatury galerii:** galerie ładują miniatury 480/960 px przez `srcset`/`sizes`, wykorzystują istniejące podglądy 240/320 px, a lightbox nadal otwiera oryginał.
            - **Backfill galerii:** *Ustawienia → Wydajność* pokazuje licznik brakujących miniaturek i przycisk przetwarzający wyłącznie zdjęcia z galerii; duże zdjęcia obsługuje ImageMagick CLI.
            - **Aktualizator jednym kliknięciem:** *Ustawienia → System* sprawdza GitHub, pobiera paczkę po HTTPS, weryfikuje SHA-256, tworzy kopie bazy i plików oraz wykonuje rollback w razie błędu.
            - **Diagnostyka aktualizacji:** po limicie GitHub API używany jest publiczny kanał `releases.atom`; opcjonalny token `update_github_token` podnosi limit, a cache sprawdzeń wynosi 12 godzin.
            - **Cookie Consent 1.0.1:** przewijanie blokuje wyłącznie pełnoekranowy modal; banery i karty nie blokują już strony.
            - **Bez zmian w bazie:** aktualizacja z 3.0.2 nie wymaga migracji — wystarczy podmienić pliki.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
