# Release notes for Modo CMS 3.6.0.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.6.0
            - **New media image editor:** Cropper.js-based crop, ±90° rotation, flips, zoom and aspect ratios.
            - **Server-side transforms:** EXIF auto-orient, rotate, flip, crop and resize with Imagick/ImageMagick CLI/GD.
            - **Faster bulk editing:** no full-size uploads, limited concurrency and progress reporting.
            - **Content list polish:** pencil icon for Edit and no more empty strip on the right of the table on large screens.

            ### Najważniejsze zmiany w 3.6.0
            - **Nowy edytor zdjęć:** crop, obrót ±90°, odbicie, zoom i proporcje w oparciu o Cropper.js.
            - **Transformacje serwerowe:** auto-orientacja EXIF, obrót, flip, crop i skalowanie przez Imagick/ImageMagick CLI/GD.
            - **Szybsza masowa edycja:** bez wysyłania pełnych plików, z ograniczoną równoległością i postępem.
            - **Poprawki listy treści:** ikona ołówka dla Edytuj i brak pustej przestrzeni po prawej stronie tabeli na dużych ekranach.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
