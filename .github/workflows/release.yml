# Release notes for Modo CMS 3.0.7.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.7
            - **Thumbnail template helpers:** `post_thumbnail_image()` / `page_thumbnail_image()` and `post_image_srcset()` / `page_image_srcset()` use the selected featured image's generated thumbnails.
            - **Phone photo orientation fixed:** EXIF Orientation is now applied to WebP copies too, so portrait 9:16 photos stay portrait instead of becoming 16:9.
            - **Old media corrected:** force regeneration rebuilds thumbnails and WebP copies; `webp_url()` falls back to the original when an old WebP has the wrong orientation.
            - **Complete translations:** all missing EN/PL/DE/ES keys were filled; `tools/i18n-audit.php` reports future gaps.

            ### Najważniejsze zmiany w 3.0.7
            - **Helpery miniatur w motywie:** `post_thumbnail_image()` / `page_thumbnail_image()` oraz `post_image_srcset()` / `page_image_srcset()` korzystają z miniatur wybranego obrazka wyróżniającego.
            - **Poprawiona orientacja zdjęć z telefonu:** EXIF Orientation jest stosowany także przy WebP, więc pionowe zdjęcia 9:16 pozostają pionowe.
            - **Poprawka istniejących mediów:** wymuszone generowanie odtwarza miniatury i kopie WebP; `webp_url()` wraca do oryginału przy złej orientacji starej kopii.
            - **Kompletne tłumaczenia:** uzupełniono brakujące klucze EN/PL/DE/ES; `tools/i18n-audit.php` raportuje przyszłe braki.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
