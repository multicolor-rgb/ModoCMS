# Release notes for Modo CMS 3.0.0.
# Builds a clean Modo CMS distribution and publishes it as a GitHub Release.
# The archive comes from `git archive`, so .gitattributes export-ignore rules
# keep CI/site/tooling out of the package. Trigger by pushing a tag (v*.*.*).
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build clean archive
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          git archive --format=zip --prefix="ModoCMS-${TAG}/" -o "ModoCMS-${TAG}.zip" "${TAG}"
          echo "Built ModoCMS-${TAG}.zip"
          unzip -l "ModoCMS-${TAG}.zip" | tail -5

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Modo CMS ${{ steps.v.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ModoCMS-*.zip
          body: |
            **Modo CMS** — a lightweight, fast and modular CMS built on PHP 8 and SQLite3.

            ### What's new in 3.0.0
            - **Page types:** reusable content presets for static pages and blog posts with default custom fields, a dedicated admin screen, `get_page_type()` / `is_page_type()` theme functions, API support and revision history that keeps the document type.
            - **Media library folders:** one-level physical folders in `uploads/`, upload to a selected folder, single and bulk moves, renaming, breadcrumb filtering and automatic URL updates across pages, posts, snippets, settings, theme data, revisions and plugin data.
            - **Media thumbnails:** lightweight 80/160/240 px images generated on upload, a backfill tool, a paginated library, lazy loading and `srcset` for HiDPI screens.
            - **Richer custom fields:** rich text (TinyMCE) and galleries with columns, gap, lightbox and captions.
            - **Forms 1.2.0:** HTML e-mail notifications enabled by default, recipient fallback chain, optional Reply-To set to the sender and a redesigned message template.
            - **Automatic slugs:** duplicate slugs are suffixed (`-1`, `-2`, …) per language in the editor, quick draft, API and revision restore.
            - **Packaging:** clean ZIP without database, uploads, `site/` or CI files.

            ### Najważniejsze zmiany w 3.0.0
            - **Typy stron:** gotowe presety treści dla stron i wpisów z domyślnymi polami niestandardowymi, osobny ekran w panelu, funkcje motywu `get_page_type()` / `is_page_type()`, obsługa w API i rewizje zachowujące typ dokumentu.
            - **Foldery w bibliotece mediów:** jednopoziomowe, fizyczne foldery w `uploads/`, upload do wybranego folderu, przenoszenie pojedyncze i zbiorcze, zmiana nazwy, filtrowanie z breadcrumbem oraz automatyczna aktualizacja adresów URL w stronach, wpisach, snippetach, ustawieniach, motywie, rewizjach i danych pluginów.
            - **Miniatury mediów:** lekkie obrazy 80/160/240 px generowane przy uploadzie, narzędzie uzupełniania biblioteki, paginowana lista, leniwe ładowanie i `srcset` dla ekranów HiDPI.
            - **Bogatsze pola niestandardowe:** tekst sformatowany (TinyMCE) oraz galerie z kolumnami, odstępem, lightboxem i podpisami.
            - **Formularze 1.2.0:** powiadomienia e-mail HTML domyślnie włączone, łańcuch fallbacku odbiorcy, opcjonalne Reply-To na adres nadawcy i przeprojektowany szablon wiadomości.
            - **Automatyczne slugi:** zajęty slug nie blokuje zapisu — w obrębie języka dopisywane jest `-1`, `-2` itd. w edytorze, szybkim szkicu, API i przywracaniu rewizji.
            - **Pakowanie:** czysty ZIP bez bazy, uploadów, `site/` i plików CI.

            Pełna lista zmian: [CHANGELOG.md](CHANGELOG.md).

            ### Install
            1. Extract the archive into your web root (or a subdirectory).
            2. Make `data/` and `uploads/` writable by the web server user.
            3. Open `/install.php` and follow the wizard, then delete it.

            Requires PHP 8.0+ with `pdo_sqlite`, `sqlite3` and `mbstring`.
            No database server and no CDN needed. Licensed under MIT.

            **Instalacja (PL)**
            1. Rozpakuj archiwum w katalogu głównym (lub podkatalogu).
            2. Nadaj prawa zapisu katalogom `data/` i `uploads/`.
            3. Otwórz `/install.php`, przejdź kreator i usuń plik.
