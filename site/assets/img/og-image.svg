<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Modo CMS — lekki CMS na PHP 8 i SQLite3">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#131c31"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.2" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <g transform="translate(90, 150)">
    <rect x="0" y="0" width="96" height="96" rx="26" fill="url(#mark)"/>
    <path d="M24 69 V33 L48 57 L72 33 V69" fill="none" stroke="#ffffff" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="72" cy="28" r="7" fill="#22d3ee"/>
  </g>

  <text x="90" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#f1f5f9">Modo CMS</text>
  <text x="90" y="392" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="500" fill="#94a3b8">Lekki, modułowy CMS na PHP 8 + SQLite3</text>
  <text x="90" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="32" font-weight="500" fill="#94a3b8">Lightweight modular CMS on PHP 8 + SQLite3</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600">
    <rect x="90" y="486" width="176" height="60" rx="30" fill="#131c31" stroke="#312e81"/>
    <text x="178" y="524" text-anchor="middle" fill="#c7d2fe">PHP 8</text>

    <rect x="286" y="486" width="210" height="60" rx="30" fill="#131c31" stroke="#312e81"/>
    <text x="391" y="524" text-anchor="middle" fill="#c7d2fe">SQLite3</text>

    <rect x="516" y="486" width="232" height="60" rx="30" fill="#131c31" stroke="#312e81"/>
    <text x="632" y="524" text-anchor="middle" fill="#c7d2fe">Bez CDN</text>

    <rect x="768" y="486" width="140" height="60" rx="30" fill="#131c31" stroke="#312e81"/>
    <text x="838" y="524" text-anchor="middle" fill="#c7d2fe">MIT</text>
  </g>

  <text x="1110" y="604" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="600" fill="#818cf8">github.com/multicolor-rgb/ModoCMS</text>
</svg>
